name: INFRA GCP EXIT P1R2 - native synthetic proof only
on:
  push:
    branches: [codex/infra-gcp-exit-p1-runtime-proof]
    paths: [.github/workflows/infra-gcp-exit-p1-runtime.yml, infra-native-proof/**]
permissions:
  contents: read
concurrency:
  group: infra-gcp-exit-p1r2-native-proof
  cancel-in-progress: false
jobs:
  native-edge-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Actual native user-worker proof - synthetic only
        run: python3 infra-native-proof/run_edge_ci.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-edge-runtime-proof
          path: |
            infra-native-proof/native-runtime-result.json
            infra-native-proof/native-runtime-container.log
          if-no-files-found: error
          retention-days: 14
